name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      # The repository commits its tsc output so a GitHub URL installs with no
      # build step; this step fails when that output no longer matches src/.
      - name: The committed lib/ matches src/
        shell: bash
        run: |
          if ! git diff --exit-code -- lib; then
            echo "::error::lib/ is stale — run 'pnpm run build' and commit the result"
            exit 1
          fi
      - run: pnpm run test:coverage
