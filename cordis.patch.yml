# The cascade ships with a read-only fast path: installing the layer answers only
# routine project-local reads of the tools below. Override this row by id in the
# profile's own cordis.patch.yml to narrow or widen allowTools and minProbability;
# every other field has a documented default editable on the Settings page.
- insert:
    - id: jev-auto-review
      name: '@deepseek-ai/dsh-experimental-jev-auto-review'
      config:
        allowTools:
          - read
          - glob
          - grep
        minProbability: 0.98
